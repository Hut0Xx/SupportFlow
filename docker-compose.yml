name: supportflow
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-supportflow}
      POSTGRES_USER: ${DB_USERNAME:-supportflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-locally}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: ./backend
    env_file: [backend/.env]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    ports: ["8000:8000"]
    volumes: [attachments:/app/storage/app/private]
  queue:
    build: ./backend
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90
    env_file: [backend/.env]
    depends_on: [api, redis]
    restart: unless-stopped
  reverb:
    build: ./backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: [backend/.env]
    depends_on: [redis]
    ports: ["8080:8080"]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [api]
    ports: ["5173:80"]
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]
volumes:
  postgres_data:
  redis_data:
  attachments:

